<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 180" role="img" aria-labelledby="title desc">
<title id="title">Footer strip</title>
<desc id="desc">An elegant vintage printed footer strip.</desc>
<defs>
<pattern id="check" width="36" height="36" patternUnits="userSpaceOnUse">
<rect width="36" height="36" fill="#fff8ef"/>
<rect width="18" height="18" fill="#e2c7b5" opacity=".5"/>
<rect x="18" y="18" width="18" height="18" fill="#bca28f" opacity=".22"/>
</pattern>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
<circle cx="3" cy="3" r=".9" fill="#7f645b" opacity=".14"/>
<circle cx="13" cy="11" r=".7" fill="#7f645b" opacity=".1"/>
</pattern>
</defs>
<rect width="1800" height="180" fill="url(#check)"/>
<rect x="24" y="24" width="1752" height="132" rx="18" fill="#fff9f2" stroke="#8a695e" stroke-width="3"/>
<rect x="44" y="44" width="1712" height="92" rx="12" fill="url(#dots)" opacity=".32"/>
<path d="M60 90H1740" stroke="#8a695e" stroke-width="2"/>
<path d="M60 74H1740" stroke="#c7aa99" stroke-width="1.2" stroke-dasharray="2 8"/>
<path d="M60 106H1740" stroke="#c7aa99" stroke-width="1.2" stroke-dasharray="2 8"/>
<text x="900" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" letter-spacing="2" fill="#6f574f">thank you for visiting AIMJWEB</text>
</svg>
