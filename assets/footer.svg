      <rect width="36" height="18" fill="#bcebed" opacity=".38"/>
      <rect width="18" height="18" fill="#efa9c3" opacity=".2"/>
    </pattern>
  </defs>
  <rect width="1200" height="180" rx="28" fill="url(#check)"/>
  <rect x="16" y="16" width="1168" height="148" rx="22" fill="#fffdf6" stroke="#f098b8" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="600" y="88" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#d86e97">thank you for visiting AIMJWEB</text>
