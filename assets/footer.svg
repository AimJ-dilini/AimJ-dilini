<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">AIMJWEB footer</title>
  <desc id="desc">Pastel gingham footer thanking visitors to AIMJWEB.</desc>
  <defs>
    <pattern id="check" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#fff8e9"/>
