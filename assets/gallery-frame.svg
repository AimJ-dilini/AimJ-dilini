<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
  <title id="title">Project gallery frame</title>
  <desc id="desc">A reusable pastel polaroid frame with tape corners and paper grid.</desc>
  <defs>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#a9ceca" stroke-width=".6" opacity=".4"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#806765" flood-opacity=".16"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="24" y="22" width="372" height="252" rx="3" fill="#fffaf0" stroke="#c9919e" stroke-width="2"/>
    <rect x="42" y="42" width="336" height="176" fill="url(#grid)" stroke="#91c5c2"/>
    <path d="M52 208L368 52M52 52l316 156" stroke="#c8dcda"/>
    <path d="M42 234H378" stroke="#dfbdc1" stroke-dasharray="2 6"/>
    <rect x="170" y="242" width="80" height="10" fill="#e9c8ce"/>
  </g>
  <g fill="#dfd1b8" fill-opacity=".75" stroke="#c9b99f">
    <path d="M7 28l78-19 7 28-78 19z"/><path d="M335 9l78 19-7 28-78-19z"/>
  </g>
</svg>
