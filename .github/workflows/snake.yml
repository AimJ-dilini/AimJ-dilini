name: DILINI.OS neural network activity

on:
  # Refresh outside peak UTC hours to reduce queue delays.
  schedule:
    - cron: "27 2 * * *"
  # Allow an initial run and manual refresh from the Actions tab.
  workflow_dispatch:

# Only the newest snake generation should run.
concurrency:
  group: dilini-os-neural-activity
  cancel-in-progress: true

# Required to publish generated assets to the output branch.
permissions:
  contents: write

jobs:
  generate:
    name: Generate and publish neural activity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generate a minimal light fallback and the primary cyber-dark variant.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: AimJ-dilini
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00C2FF&color_dots=#05070D,#0B4F6C,#007EA7,#00C2FF,#A855F7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the generated files to the branch referenced by README.md.
      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          commit_message: "chore: refresh DILINI.OS neural activity"
