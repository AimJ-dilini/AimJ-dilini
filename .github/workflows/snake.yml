name: Generate contribution snake

on:
  # Refresh the animation once per day.
  schedule:
    - cron: "15 0 * * *"
  # Allow an initial run and manual refresh from the Actions tab.
  workflow_dispatch:

# Only the newest snake generation should run.
concurrency:
  group: contribution-snake
  cancel-in-progress: true

# Required to publish generated assets to the output branch.
permissions:
  contents: write

jobs:
  generate:
    name: Generate and publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generate light and dark SVG variants for the profile README.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: AimJ-dilini
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58A6FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the generated files to the branch referenced by README.md.
      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          commit_message: "chore: refresh contribution snake"
