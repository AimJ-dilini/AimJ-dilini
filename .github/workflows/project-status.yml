name: DILINI.OS system status

on:
  # Refresh the status panel every day after the contribution workflow.
  schedule:
    - cron: "45 2 * * *"
  # Allow a manual status refresh from the Actions tab.
  workflow_dispatch:

# The workflow updates the marked status block in README.md.
permissions:
  contents: write

# Avoid multiple status jobs editing README.md at the same time.
concurrency:
  group: dilini-os-system-status
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh DILINI.OS status panel
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Check out the profile repository before updating README.md.
      - name: Check out repository
        uses: actions/checkout@v5

      # Replace only the LAST SYNC value inside the protected status markers.
      - name: Update status timestamp
        shell: python
        run: |
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          path = Path("README.md")
          readme = path.read_text(encoding="utf-8")
          start = readme.index("<!-- STATUS:START -->")
          end = readme.index("<!-- STATUS:END -->")
          status = readme[start:end]
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d UTC")
          status = re.sub(
              r"(<td><code>LAST SYNC</code></td>\s*<td><strong>).*?(</strong></td>)",
              rf"\g<1>{today}\g<2>",
              status,
              flags=re.DOTALL,
          )
          path.write_text(readme[:start] + status + readme[end:], encoding="utf-8")

      # Commit only when the daily timestamp changed.
      - name: Commit refreshed status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "System status is already current."
          else
            git commit -m "chore: sync DILINI.OS status"
            git push
          fi
