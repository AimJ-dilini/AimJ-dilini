name: Generate 3D contribution graph

on:
  # Refresh daily at 01:00 UTC.
  schedule:
    - cron: "0 1 * * *"
  # Allow the first graph to be generated on demand.
  workflow_dispatch:

# The workflow commits generated SVG files to the main branch.
permissions:
  contents: write

# Avoid overlapping commits from scheduled and manual runs.
concurrency:
  group: profile-3d-contribution
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and commit 3D graph
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Check out the profile repository so generated files can be committed.
      - name: Check out repository
        uses: actions/checkout@v5

      # Generate the full set of 3D contribution graph themes.
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: AimJ-dilini

      # Commit only when the generated assets changed.
      - name: Commit generated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No graph changes to commit."
          else
            git commit -m "chore: refresh 3D contribution graph"
            git push
          fi
